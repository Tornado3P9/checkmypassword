name: Build and sign release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: |
          cargo build --locked --release

          package_name="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])')"

          mkdir -p dist
          cp "target/release/$package_name" "dist/$package_name-linux-x86_64"

      - name: Create checksums and GPG signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          test -n "$GPG_PASSPHRASE"

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          cd dist
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS' \
            ! -name 'SHA256SUMS.asc' \
            -printf '%f\0' \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS

          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign \
            --output SHA256SUMS.asc \
            SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
